    <script>
      (function() {
        try {
          var raw = localStorage.getItem('ufrgs_accessibility_settings');
          if (raw) {
            var s = JSON.parse(raw);
            if (s.theme === 'dark') {
              document.documentElement.classList.add('dark');
              document.documentElement.style.colorScheme = 'dark';
            }
            if (s.highContrast) document.documentElement.classList.add('high-contrast');
            if (s.dyslexicFont) document.documentElement.classList.add('dyslexic-font');
            if (s.reduceMotion) document.documentElement.classList.add('reduce-motion');
            if (s.fontSize === 'grande') document.documentElement.style.fontSize = '18px';
            else if (s.fontSize === 'extragrande') document.documentElement.style.fontSize = '21px';
          }
        } catch (e) {}
      })();
    </script>
